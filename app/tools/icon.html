<!doctype html>
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; background: transparent; }
  svg { display: block; }
</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a32"/>
      <stop offset="1" stop-color="#15151a"/>
    </linearGradient>
  </defs>
  <!-- squircle do macOS: 824px centralizado, raio ~ 185 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="6"/>
  <!-- três linhas de checklist -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- 1: concluída -->
    <circle cx="300" cy="350" r="52" fill="#4caf50"/>
    <path d="M272 352 l20 20 l40 -44" stroke="#15151a" stroke-width="18"/>
    <rect x="410" y="330" width="330" height="40" rx="20" fill="#5c5c66"/>
    <!-- 2: em andamento -->
    <circle cx="300" cy="512" r="52" stroke="#f5c542" stroke-width="22"/>
    <path d="M300 460 a52 52 0 0 1 0 104 z" fill="#f5c542"/>
    <rect x="410" y="492" width="300" height="40" rx="20" fill="#f5c542"/>
    <!-- 3: pendente -->
    <circle cx="300" cy="674" r="52" stroke="#8a8a94" stroke-width="22"/>
    <rect x="410" y="654" width="240" height="40" rx="20" fill="#5c5c66"/>
  </g>
</svg>
</body></html>
